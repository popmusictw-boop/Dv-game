<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>北特教案生成系統</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo" aria-hidden="true">北特</span><span class="title">教案生成系統</span></div>
  <div class="top-actions" id="topActions" hidden>
    <span id="saveState" class="save-state" aria-live="polite"></span>
    <button class="btn ghost" id="btnDrafts" type="button">我的教案</button>
    <button class="btn ghost" id="btnLogout" type="button">登出</button>
  </div>
</header>

<main id="app">
  <section id="loginView" class="card narrow" hidden>
    <h1>教師登入</h1>
    <p class="muted">本系統處理學生個人資料，僅限授權教師使用。帳號由學校管理者建立。</p>
    <form id="loginForm" autocomplete="on">
      <label>帳號（教師代碼）<input name="username" required autocomplete="username" autocapitalize="none" inputmode="numeric" placeholder="例：1234"></label>
      <label>密碼<input name="password" type="password" required autocomplete="current-password"></label>
      <button class="btn primary block" type="submit">登入</button>
      <p class="error" id="loginErr" role="alert"></p>
    </form>
  </section>

  <section id="homeView" hidden>
    <div class="card">
      <div class="row space">
        <h1>我的教案</h1>
        <button class="btn primary" id="btnNew" type="button">＋ 新增教案</button>
      </div>
      <div id="draftList" class="draft-list"></div>
    </div>
    <div class="card" id="sourcesCard"></div>
  </section>

  <section id="editorView" hidden>
    <nav class="stepper" id="stepper" aria-label="教案製作步驟"></nav>
    <div id="stepBody"></div>
    <div class="step-nav">
      <button class="btn" id="btnPrev" type="button">← 上一步</button>
      <button class="btn primary" id="btnNext" type="button">下一步 →</button>
    </div>
  </section>
</main>

<dialog id="modal"><div id="modalBody"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
